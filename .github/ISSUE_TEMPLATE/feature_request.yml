name: "💡 Предложить улучшение"
description: "Идеи для новых механик и удобства игры"
title: "[Идея] "
body:
  - type: textarea
    id: idea
    attributes:
      label: Что предлагаете?
      description: Кратко опишите идею и для кого она полезна
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Какую проблему решает?
      description: Что станет удобнее или интереснее игрокам?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Дополнительные детали
      description: Примеры, ссылки, изображения — по желанию
    validations:
      required: false
